name: CI

# Offline test run: builds the published RFL binding from the (public) rfl repo and runs
# the full pytest suite. The Claude emitter tests use a fake client, so no API key is
# needed — the whole suite is hermetic.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout cobel
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: cobel

      - name: Checkout rfl (the neutral standard — public)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: robotfoundationlayer/rfl
          path: rfl

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install cobel + build the rfl binding
        working-directory: cobel
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # maturin build-backend builds the abi3 wheel from the rfl checkout (sibling dir).
          pip install ../rfl/bindings/python

      - name: Run tests (offline — no ANTHROPIC_API_KEY)
        working-directory: cobel
        run: python -m pytest -q
